<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorFlow - Modern Educator Suite</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <main id="mainContainer" class="max-w-4xl mx-auto">
    <!-- Rendered via JS -->
  </main>

  <!-- Navigation Menu Modal -->
  <div id="navMenuModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-80 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-indigo-400">Menu Navigation</h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold">&times;</button>
      </div>
      <div class="flex flex-col space-y-2 font-medium text-sm">
        <button id="navDashboard" class="text-left px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-200">
          • Dashboard
        </button>
        <button id="navLab" class="text-left px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-200">
          • Physics Lab
        </button>
        <button id="navInclined" class="text-left px-6 py-1.5 text-xs text-slate-400 hover:text-indigo-400">
          • Inclined Plane
        </button>
        <button id="navRelative" class="text-left px-6 py-1.5 text-xs text-slate-400 hover:text-indigo-400">
          • Relative Velocity
        </button>
      </div>
    </div>
  </div>

  <!-- Student Management Modal -->
  <div id="studentModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-96 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white">+ Add / Delete Student</h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold">&times;</button>
      </div>
      <form id="studentForm" class="space-y-3">
        <input type="text" id="stName" placeholder="Name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
        <input type="text" id="stPhone" placeholder="Phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
        <input type="text" id="stClass" placeholder="Class" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
        <input type="number" id="stSalary" placeholder="Salary (৳)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2 rounded-xl text-xs">
          + Add Student
        </button>
      </form>
      <div class="space-y-2 max-h-48 overflow-y-auto pt-2" id="studentListContainer">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- Pending Tasks Management Modal -->
  <div id="taskModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-96 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white">Tasks Entry & Management</h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold">&times;</button>
      </div>
      <form id="taskForm" class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-400">Work Description:</label>
          <input type="text" id="taskWork" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Time:</label>
          <input type="text" id="taskTime" placeholder="e.g. 10:00 AM" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2 rounded-xl text-xs">
          + Save Task
        </button>
      </form>

      <div class="border-t border-slate-800 pt-3">
        <p class="text-xs font-bold text-slate-400 mb-2">Current Tasks:</p>
        <div id="taskListModalContainer" class="space-y-2 max-h-40 overflow-y-auto">
          <!-- Task list rendered here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Teaching Progress Modal -->
  <div id="teachingModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-80 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white">Edit Teaching Progress</h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold">&times;</button>
      </div>
      <form id="teachingForm" class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-400">Target Chapter:</label>
          <input type="text" id="tpChapter" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Target Student:</label>
          <input type="text" id="tpStudent" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Progress (%):</label>
          <input type="number" id="tpProgress" min="0" max="100" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2 rounded-xl text-xs">
          Update Progress
        </button>
      </form>
    </div>
  </div>

  <!-- Exam Marks Modal -->
  <div id="examModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-80 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white">Student Exam Progress</h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold">&times;</button>
      </div>
      <form id="examForm" class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-400">Student:</label>
          <input type="text" id="epStudent" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Exam Name:</label>
          <input type="text" id="epExam" placeholder="e.g. Exam 1" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Chapter:</label>
          <input type="text" id="epChapt" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Marks Gotten (%):</label>
          <input type="number" id="epMarks" min="0" max="100" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2 rounded-xl text-xs">
          Save Marks
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
